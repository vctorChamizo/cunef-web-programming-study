  <script>
    // Language: /en/... (or the saved preference on the home page) loads the English data.
    // The page is always served from the site root (404.html sends deep links there with ?p=).
    (function () {
      var l = location, base = /\.github\.io$/.test(l.hostname) ? '/' + l.pathname.split('/')[1] + '/' : '/';
      var rest = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : '';
      var p = (new URLSearchParams(l.search).get('p') || '').replace(/^\//, '');
      var path = rest || p, stored = null;
      try { stored = localStorage.getItem('g247-lang'); } catch (e) {}
      var en = /^en(\/|$)/.test(path) || (!path && stored === 'en');
      window.LANG = en ? 'en' : 'es';
      document.documentElement.lang = window.LANG;
      var files = en
        ? ['data/en/course.js', 'data/en/quizzes.js', 'data/guides.js', 'data/en/exercises.js', 'data/en/practice-bank.js', 'assets/i18n-en.js']
        : ['data/course.js', 'data/quizzes.js', 'data/guides.js', 'data/exercises.js', 'data/practice-bank.js'];
      for (var i = 0; i < files.length; i++) document.write('<script src="' + files[i] + '"><\/script>');
    })();
  </script>
